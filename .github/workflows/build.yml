name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Serialize back-to-back main pushes — don't kill an in-flight arch-infra bump.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      # test:fast excludes e2e + compatibility; both need a live Ollama which CI lacks.
      # Full suite stays a local pre-merge gate (npm test).
      - run: npm run test:fast

  build-and-deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/autumnfallenwang/llm-gateway:latest
            ghcr.io/autumnfallenwang/llm-gateway:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in arch-infra
        env:
          GH_TOKEN: ${{ secrets.ARCH_INFRA_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::ARCH_INFRA_TOKEN not set — see docs/k3s-migration/01-PLAN.md §0. Skipping arch-infra bump."
            exit 0
          fi

          git clone "https://x-access-token:${GH_TOKEN}@github.com/autumnfallenwang/arch-infra.git" /tmp/arch-infra
          cd /tmp/arch-infra

          if [ ! -f apps/llmgw.yaml ]; then
            echo "::warning::apps/llmgw.yaml not present in arch-infra (task 45 pending). Skipping bump."
            exit 0
          fi

          # Rewrite the ArgoCD Application's image.tag parameter. yq is preinstalled on ubuntu-latest.
          yq -i '(.spec.source.helm.parameters[] | select(.name == "image.tag") | .value) = strenv(SHA)' apps/llmgw.yaml

          git config user.email "actions@github.com"
          git config user.name  "GitHub Actions"

          if git diff --quiet apps/llmgw.yaml; then
            echo "No change — arch-infra apps/llmgw.yaml already at $SHA."
            exit 0
          fi

          git add apps/llmgw.yaml
          git commit -m "llmgw: bump image to $SHA"
          git push
