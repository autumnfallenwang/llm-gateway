version: 2
updates:
  # npm: pi-ai ships new Anthropic/Codex model IDs over time; weekly bumps
  # keep /v1/models current without manual `ncu -u` runs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Above the usual backlog of open npm PRs, so a pi-ai bump isn't held back by them.
    open-pull-requests-limit: 10
    groups:
      pi-ai:
        patterns:
          - "@earendil-works/pi-ai"
      hono:
        patterns:
          - "hono"
          - "@hono/*"

  # Docker base image (node:22-alpine → security backports, eventually node:24).
  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday

  # GHA actions (checkout/setup-node/docker-* — drift starts forcing Node 24 on
  # 2026-06-02; bumps will surface before then).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
