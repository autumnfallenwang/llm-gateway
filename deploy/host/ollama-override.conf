# systemd drop-in for /etc/systemd/system/ollama.service.d/override.conf
#
# Rebinds the host Ollama daemon from 127.0.0.1:11434 to 0.0.0.0:11434 so the
# k3s pod (in namespace llmgw) can reach it through a manual Service+Endpoints
# pointing at 192.168.1.163:11434. See docs/k3s-migration/01-PLAN.md §2.
#
# Multiple Environment= lines are additive — this does NOT overwrite the unit's
# existing PATH env.

[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
