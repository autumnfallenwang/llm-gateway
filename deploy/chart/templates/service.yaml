apiVersion: v1
kind: Service
metadata:
  name: {{ include "llmgw.fullname" . }}
  labels:
    {{- include "llmgw.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "llmgw.selectorLabels" . | nindent 4 }}
