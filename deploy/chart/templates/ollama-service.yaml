# Selectorless Service + EndpointSlice pointing at the host Ollama daemon.
# Pod-to-host plumbing: the app reaches Ollama at `http://ollama.<namespace>:11434`
# without knowing the host IP. EndpointSlice (not the deprecated v1/Endpoints)
# so ArgoCD's default resource tracking picks it up.
apiVersion: v1
kind: Service
metadata:
  name: ollama
  labels:
    {{- include "llmgw.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.ollama.port }}
      targetPort: {{ .Values.ollama.port }}
      protocol: TCP
      name: http
  # No selector — EndpointSlice below provides the targets directly.
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ollama
  labels:
    # Required: kube-proxy uses this label to associate the slice with the Service.
    kubernetes.io/service-name: ollama
    {{- include "llmgw.labels" . | nindent 4 }}
addressType: IPv4
ports:
  - port: {{ .Values.ollama.port }}
    protocol: TCP
    name: http
endpoints:
  - addresses:
      - {{ .Values.ollama.hostIp | quote }}
    conditions:
      ready: true
