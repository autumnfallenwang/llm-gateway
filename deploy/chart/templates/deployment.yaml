apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "llmgw.fullname" . }}
  labels:
    {{- include "llmgw.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # Recreate, not RollingUpdate — two pods sharing the ReadWriteOnce PVC + SQLite WAL
  # would race and corrupt the DB.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "llmgw.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "llmgw.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: llmgw
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            {{- if .Values.hostMounts.gemini.enabled }}
            - name: GEMINI_CREDENTIALS_PATH
              value: {{ printf "%s/oauth_creds.json" .Values.hostMounts.gemini.mountPath | quote }}
            {{- end }}
          livenessProbe:
            {{- toYaml .Values.probes.liveness | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.probes.readiness | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.persistence.enabled }}
            - name: data
              mountPath: {{ .Values.persistence.mountPath }}
            {{- end }}
            {{- if .Values.hostMounts.claude.enabled }}
            - name: host-claude
              mountPath: {{ .Values.hostMounts.claude.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.hostMounts.codex.enabled }}
            - name: host-codex
              mountPath: {{ .Values.hostMounts.codex.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.hostMounts.gemini.enabled }}
            - name: host-gemini
              mountPath: {{ .Values.hostMounts.gemini.mountPath }}
              readOnly: true
            {{- end }}
      volumes:
        {{- if .Values.persistence.enabled }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "llmgw.fullname" . }}-data
        {{- end }}
        {{- if .Values.hostMounts.claude.enabled }}
        - name: host-claude
          hostPath:
            path: {{ .Values.hostMounts.claude.hostPath }}
            type: Directory
        {{- end }}
        {{- if .Values.hostMounts.codex.enabled }}
        - name: host-codex
          hostPath:
            path: {{ .Values.hostMounts.codex.hostPath }}
            type: Directory
        {{- end }}
        {{- if .Values.hostMounts.gemini.enabled }}
        - name: host-gemini
          hostPath:
            path: {{ .Values.hostMounts.gemini.hostPath }}
            type: Directory
        {{- end }}
