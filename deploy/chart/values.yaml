# Default values for the llmgw chart.
# Override these via `helm install --set` or a separate values file (e.g. via
# the ArgoCD Application's spec.source.helm.parameters in arch-infra).

image:
  repository: ghcr.io/autumnfallenwang/llm-gateway
  # CI bumps `tag` to a commit SHA in the ArgoCD Application's parameters.
  tag: latest
  pullPolicy: IfNotPresent

# SQLite + WAL is single-writer, and the PVC is ReadWriteOnce — do not scale.
replicaCount: 1

service:
  port: 80
  targetPort: 51277

ingress:
  enabled: true
  className: traefik
  host: llmgw.arch.internal

persistence:
  enabled: true
  size: 1Gi
  storageClass: local-path
  mountPath: /home/node/.llm-gateway

# Environment variables passed to the container. Add/override here when shipping
# new config knobs — the deployment template iterates over this map.
env:
  LLM_GATEWAY_PORT: "51277"
  # The names callers use. Anything else gets a 403 (src/lib/request-guard.ts).
  LLMGW_ALLOWED_HOSTS: llmgw.llmgw.svc.cluster.local,llmgw.arch.internal
  # Direct host IP: the cluster's ArgoCD installation excludes both Endpoints
  # and EndpointSlice from sync (UI clutter reduction default), so a manual
  # Service+Endpoints redirection silently drops on every sync. Single-host
  # k3s with a known LAN IP makes the indirection cosmetic anyway.
  OLLAMA_BASE_URL: http://192.168.1.163:11434
  ANTHROPIC_SEED_PATH: /home/node/host-claude/.credentials.json
  CODEX_CREDENTIALS_PATH: /home/node/host-codex/auth.json
  # GPT models via the host's ChatGPT login (a Go plan: gpt-6-luna, gpt-5.6-terra,
  # gpt-5.6-luna). Read-only: the host's Codex client (VS Code ChatGPT extension)
  # keeps auth.json refreshed and the gateway re-reads it when it changes. Set
  # "false" if the host has no ChatGPT login, so the models don't show as errors.
  CODEX_ENABLED: "true"
  # DeepSeek's static API key (metered, prepaid). ~/.deepseek/api_key on the host is the
  # key's single source of truth (~/.zshrc reads it too); no file, no DeepSeek models.
  # See docs/deepseek-provider.md.
  DEEPSEEK_CREDENTIALS_PATH: /home/node/host-deepseek/api_key
  LLMGW_DB_PATH: /home/node/.llm-gateway/state.db

# Read-only directory mounts from the host node. `Directory` (not `File`) so
# atomic-rename rotations by the host CLIs don't pin the container to a stale
# inode (Phase 6 fix).
hostMounts:
  claude:
    enabled: true
    hostPath: /home/aaronwang/.claude
    mountPath: /home/node/host-claude
  # The host's ChatGPT login (auth.json), read by the gateway; see CODEX_ENABLED.
  codex:
    enabled: true
    hostPath: /home/aaronwang/.codex
    mountPath: /home/node/host-codex
  # The DeepSeek API key (api_key); see DEEPSEEK_CREDENTIALS_PATH. Must exist on the host.
  deepseek:
    enabled: true
    hostPath: /home/aaronwang/.deepseek
    mountPath: /home/node/host-deepseek

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Pod-level securityContext: applies to all containers in the pod.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Container-level securityContext: per-container hardening. allowPrivilegeEscalation
# only takes effect at this level — k8s drops it silently if set on the pod.
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    httpGet:
      path: /
      port: 51277
    initialDelaySeconds: 10
    periodSeconds: 30
  readiness:
    httpGet:
      path: /
      port: 51277
    initialDelaySeconds: 3
    periodSeconds: 10
