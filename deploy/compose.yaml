name: llm-gateway

services:
  llm-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: llm-gateway
    network_mode: host
    restart: unless-stopped
    # Cap stdout/stderr capture at 50MB total (5 × 10MB rotated). Promtail/Loki
    # tail all rotation files, so capping doesn't lose log history downstream.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      # Read-only directory mounts (avoids inode pinning when host CLIs rotate credential files)
      - ~/.claude:/home/node/host-claude:ro
      - ~/.codex:/home/node/host-codex:ro
      # Writable volume — holds the container's own credential cache + validation report
      - ~/.llm-gateway:/home/node/.llm-gateway
    environment:
      - LLM_GATEWAY_PORT=51277
      - OLLAMA_BASE_URL=http://localhost:11434
      # Anthropic: seed read-only from host file once, then maintain own chain in cache
      - ANTHROPIC_SEED_PATH=/home/node/host-claude/.credentials.json
      - ANTHROPIC_CACHE_PATH=/home/node/.llm-gateway/anthropic-credentials.json
      # Codex: seed-only (28-day JWT, lazy refresh is a follow-up)
      - CODEX_CREDENTIALS_PATH=/home/node/host-codex/auth.json
      - VALIDATION_FILE_PATH=/home/node/.llm-gateway/models.json
