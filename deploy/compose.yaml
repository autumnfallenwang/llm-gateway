name: llm-gateway

services:
  llm-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: llm-gateway
    network_mode: host
    restart: unless-stopped
    volumes:
      - ~/.claude/.credentials.json:/home/node/.claude/.credentials.json:ro
      - ~/.codex/auth.json:/home/node/.codex/auth.json:ro
      - ~/.llm-gateway:/home/node/.llm-gateway
    environment:
      - LLM_GATEWAY_PORT=51277
      - OLLAMA_BASE_URL=http://localhost:11434
      - ANTHROPIC_CREDENTIALS_PATH=/home/node/.claude/.credentials.json
      - CODEX_CREDENTIALS_PATH=/home/node/.codex/auth.json
      - VALIDATION_FILE_PATH=/home/node/.llm-gateway/models.json
